{% extends "base.html" %}

{% block content %}
<h1>Tipos de Pratos</h1>

<ul>
    {% for type in dish_type_list %}
        <li>{{ type.name }}</li>
    {% empty %}
        <p>Nenhum tipo de prato registrado.</p>
    {% endfor %}
</ul>

<a href="{% url 'kitchen:dish-type-create' %}">➕ Adicionar tipo de prato</a>
{% endblock %}
